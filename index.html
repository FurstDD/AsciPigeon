<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AsciPigeon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d0d;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }

    /* Subtiele bestrating */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    #pigeon {
      position: absolute;
      white-space: pre;
      font-size: 16px;
      line-height: 1.4;
      color: #b0bec5;
      text-shadow:
        0 0 6px rgba(176, 190, 197, 0.25),
        0 0 20px rgba(176, 190, 197, 0.08);
      transform: translate(-50%, -50%);
      pointer-events: none;
      user-select: none;
      will-change: left, top;
    }

    #shadow {
      position: absolute;
      width: 34px;
      height: 7px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.6) 0%, transparent 72%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* WASD + spatiebalk toetsenbord (rechtsonder) */
    #keyboard {
      position: fixed;
      bottom: 22px;
      right: 24px;
      display: grid;
      grid-template-columns: repeat(3, 34px);
      grid-template-rows: repeat(3, 34px);
      gap: 3px;
      opacity: 0.4;
      transition: opacity 0.3s;
    }
    #keyboard:hover { opacity: 0.7; }

    .key {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
      border-radius: 5px;
      font-size: 12px;
      font-family: 'Courier New', monospace;
      color: #555;
      background: #161616;
      transition: background 0.08s, color 0.08s, border-color 0.08s;
    }
    .key.active {
      background: #252525;
      color: #ccc;
      border-color: #666;
    }

    #key-w     { grid-column: 2;     grid-row: 1; }
    #key-a     { grid-column: 1;     grid-row: 2; }
    #key-s     { grid-column: 2;     grid-row: 2; }
    #key-d     { grid-column: 3;     grid-row: 2; }
    #key-space { grid-column: 1 / 4; grid-row: 3; font-size: 10px; letter-spacing: 1px; }

    #title {
      position: fixed;
      top: 20px;
      left: 24px;
      font-size: 13px;
      color: #2a2a2a;
      letter-spacing: 3px;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="title">ASCIPIGEON</div>
<div id="shadow"></div>
<div id="pigeon"></div>

<div id="keyboard">
  <div id="key-w" class="key">W</div>
  <div id="key-a" class="key">A</div>
  <div id="key-s" class="key">S</div>
  <div id="key-d" class="key">D</div>
  <div id="key-space" class="key">SPACE</div>
</div>

<script>
  // ─── ASCII poses ─────────────────────────────────────────────────────────────
  //
  //  ASCII art door de gebruiker. 4 richtingen, elk 4 frames:
  //  [stilstaand, rechterpoot omhoog, stilstaand, linkerpoot omhoog]
  //
  //  Richting → toets:
  //    front (voorkant) → S
  //    back  (rug)      → W
  //    right (rechts)   → D
  //    left  (links)    → A
  //
  //  Horizontale beweging (A/D) heeft prioriteit boven verticaal (W/S)
  //  zodat de duif altijd links of rechts kijkt bij diagonaal lopen.

  // Sprongpose per richting (beide poten omhoog)
  const JUMP_POSES = {
    front: "   .-. \n  /'v'\\\n (/   \\)\n   \" \" ",
    back:  "   .-. \n  /   \\\n (/-+-\\)\n   \" \" ",
    right: "   .-. \n  / 'c\\\n (/   )\n   ` ` ",
    left:  "   .-. \n /ↄ' \\ \n  (   \\)\n   ` ` ",
  };

  const POSES = {
    front: [
      // 0 — stilstaand
      "   .-. \n  /'v'\\\n (/   \\)\n   - - ",
      // 1 — rechterpoot omhoog
      "   .-. \n  /'v'\\\n (/   \\)\n   \" - ",
      // 2 — stilstaand
      "   .-. \n  /'v'\\\n (/   \\)\n   - - ",
      // 3 — linkerpoot omhoog
      "   .-. \n  /'v'\\\n (/   \\)\n   - \" ",
    ],
    back: [
      "   .-. \n  /   \\\n (/-+-\\)\n   - - ",
      "   .-. \n  /   \\\n (/-+-\\)\n   - \" ",
      "   .-. \n  /   \\\n (/-+-\\)\n   - - ",
      "   .-. \n  /   \\\n (/-+-\\)\n   \" - ",
    ],
    right: [
      "   .-. \n  / 'c\\\n (/   )\n   - - ",
      "   .-. \n  / 'c\\\n (/   )\n   ` - ",
      "   .-. \n  / 'c\\\n (/   )\n   - - ",
      "   .-. \n  / 'c\\\n (/   )\n   - ` ",
    ],
    left: [
      "   .-. \n /ↄ' \\ \n  (   \\)\n   - - ",
      "   .-. \n /ↄ' \\ \n  (   \\)\n   ` - ",
      "   .-. \n /ↄ' \\ \n  (   \\)\n   - - ",
      "   .-. \n /ↄ' \\ \n  (   \\)\n   - ` ",
    ],
  };

  // ─── Config ──────────────────────────────────────────────────────────────────

  const CFG = {
    speed:      3.2,    // pixels per frame
    walkFPS:    7,      // stapframes per seconde
    margin:     56,     // rand (px)
    jumpForce: -11,     // beginsnelheid sprong (px/frame, negatief = omhoog)
    gravity:    0.75,   // zwaartekracht (px/frame²)
  };

  // ─── State ───────────────────────────────────────────────────────────────────

  let x            = window.innerWidth  / 2;
  let y            = window.innerHeight / 2;
  let direction    = 'front';
  let frameIndex   = 0;
  let lastWalkTime = 0;

  // Sprong
  let jumping      = false;
  let jumpVelocity = 0;
  let jumpOffset   = 0;   // pixels omhoog t.o.v. grond (negatief = in de lucht)

  const keys = { w: false, a: false, s: false, d: false };

  // ─── Toetsenbord ─────────────────────────────────────────────────────────────

  const KEY_MAP = {
    w: 'w', W: 'w', ArrowUp:    'w',
    a: 'a', A: 'a', ArrowLeft:  'a',
    s: 's', S: 's', ArrowDown:  's',
    d: 'd', D: 'd', ArrowRight: 'd',
  };

  document.addEventListener('keydown', e => {
    // Spatiebalk → sprong
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (!jumping) {
        jumping      = true;
        jumpVelocity = CFG.jumpForce;
        document.getElementById('key-space')?.classList.add('active');
      }
      return;
    }
    const k = KEY_MAP[e.key];
    if (!k) return;
    e.preventDefault();
    if (!keys[k]) {
      keys[k] = true;
      document.getElementById('key-' + k)?.classList.add('active');
    }
  });

  document.addEventListener('keyup', e => {
    if (e.key === ' ' || e.code === 'Space') {
      document.getElementById('key-space')?.classList.remove('active');
      return;
    }
    const k = KEY_MAP[e.key];
    if (!k) return;
    keys[k] = false;
    document.getElementById('key-' + k)?.classList.remove('active');
  });

  // ─── DOM ─────────────────────────────────────────────────────────────────────

  const pigeonEl = document.getElementById('pigeon');
  const shadowEl = document.getElementById('shadow');

  // ─── Animatielus ─────────────────────────────────────────────────────────────

  function tick(timestamp) {
    // Bewegingsvector
    let dx = 0, dy = 0;
    if (keys.w) dy -= CFG.speed;
    if (keys.s) dy += CFG.speed;
    if (keys.a) dx -= CFG.speed;
    if (keys.d) dx += CFG.speed;

    // Diagonaal normaliseren
    if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

    const moving = dx !== 0 || dy !== 0;

    // Richting: horizontaal heeft prioriteit
    if      (dx > 0) direction = 'right';
    else if (dx < 0) direction = 'left';
    else if (dy < 0) direction = 'back';
    else if (dy > 0) direction = 'front';

    // Positie binnen venster houden
    const m = CFG.margin;
    x = Math.max(m, Math.min(window.innerWidth  - m, x + dx));
    y = Math.max(m, Math.min(window.innerHeight - m, y + dy));

    // Sprong-fysica
    if (jumping) {
      jumpVelocity += CFG.gravity;
      jumpOffset   += jumpVelocity;
      if (jumpOffset >= 0) {           // landing
        jumpOffset   = 0;
        jumpVelocity = 0;
        jumping      = false;
        document.getElementById('key-space')?.classList.remove('active');
      }
    }

    // Stapframe (alleen op de grond)
    if (!jumping && moving && timestamp - lastWalkTime > 1000 / CFG.walkFPS) {
      frameIndex   = (frameIndex + 1) % 4;
      lastWalkTime = timestamp;
    }
    if (!moving && !jumping) frameIndex = 0;

    // Pose kiezen
    const pose = jumping
      ? JUMP_POSES[direction]
      : POSES[direction][frameIndex];

    // Schaduw krimpt naarmate de duif hoger is
    const shadowScale   = Math.max(0.25, 1 + jumpOffset / 90);
    const shadowOpacity = Math.max(0.15, 0.6 * shadowScale);

    pigeonEl.textContent = pose;
    pigeonEl.style.left  = x + 'px';
    pigeonEl.style.top   = (y + jumpOffset) + 'px';   // sprong offset hier

    shadowEl.style.left      = x + 'px';
    shadowEl.style.top       = (y + 42) + 'px';       // schaduw blijft op de grond
    shadowEl.style.transform = `translate(-50%, -50%) scaleX(${shadowScale})`;
    shadowEl.style.opacity   = shadowOpacity;

    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', () => {
    x = Math.min(x, window.innerWidth  - CFG.margin);
    y = Math.min(y, window.innerHeight - CFG.margin);
  });

  requestAnimationFrame(tick);
</script>

</body>
</html>
