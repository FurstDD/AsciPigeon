<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DON'T EAT THE HASHTAG</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.011) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.011) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* ── Pigeon ─────────────────────────────────────────────────────────────── */

    #pigeon {
      position: absolute;
      white-space: pre;
      font-size: 16px;
      line-height: 1.4;
      color: #b0bec5;
      text-shadow:
        0 0 6px rgba(176, 190, 197, 0.25),
        0 0 20px rgba(176, 190, 197, 0.08);
      transform: translate(-50%, -50%);
      pointer-events: none;
      user-select: none;
      will-change: left, top;
    }

    /* RGB split overlays — visible only during glitch */
    #pigeon-r, #pigeon-b {
      position: absolute;
      white-space: pre;
      font-size: 16px;
      line-height: 1.4;
      transform: translate(-50%, -50%);
      pointer-events: none;
      user-select: none;
      display: none;
      opacity: 0.65;
      mix-blend-mode: screen;
    }
    #pigeon-r { color: #ff1f1f; }
    #pigeon-b { color: #1ffff0; }

    #shadow {
      position: absolute;
      width: 34px;
      height: 7px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.6) 0%, transparent 72%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* ── Hashtag ─────────────────────────────────────────────────────────────── */

    #hashtag {
      position: absolute;
      font-size: 30px;
      font-family: 'Courier New', monospace;
      color: rgba(228, 228, 228, 0.6);
      text-shadow:
        0 0 8px  rgba(228, 228, 228, 0.3),
        0 0 32px rgba(228, 228, 228, 0.1);
      transform: translate(-50%, -50%);
      pointer-events: none;
      user-select: none;
      animation: breathe 3.8s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.42; transform: translate(-50%, -50%) scale(1.00); }
      50%       { opacity: 0.78; transform: translate(-50%, -50%) scale(1.06); }
    }

    /* ── Glitch overlays ────────────────────────────────────────────────────── */

    #glitch-flash {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.05s;
      z-index: 10;
    }

    /* ── Warning text ───────────────────────────────────────────────────────── */

    #warning {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Courier New', monospace;
      font-size: 12px;
      letter-spacing: 5px;
      color: rgba(210, 210, 210, 0.55);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.4s;
      z-index: 5;
    }

    /* ── Mobile controls ────────────────────────────────────────────────────── */

    #dpad {
      position: fixed;
      bottom: 20px;
      left: 20px;
      display: grid;
      grid-template-columns: repeat(3, 54px);
      grid-template-rows: repeat(2, 54px);
      gap: 5px;
      touch-action: none;
      z-index: 20;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #2e2e2e;
      border-radius: 10px;
      font-size: 20px;
      color: #4a4a4a;
      background: rgba(14, 14, 14, 0.85);
      cursor: pointer;
      user-select: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.08s, color 0.08s, border-color 0.08s;
    }
    .btn.active {
      background: rgba(38, 38, 38, 0.95);
      color: #bbb;
      border-color: #5a5a5a;
    }

    #btn-w { grid-column: 2; grid-row: 1; }
    #btn-a { grid-column: 1; grid-row: 2; }
    #btn-s { grid-column: 2; grid-row: 2; }
    #btn-d { grid-column: 3; grid-row: 2; }

    #btn-jump {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      font-size: 26px;
      touch-action: none;
      z-index: 20;
    }
  </style>
</head>
<body>

<div id="shadow"></div>
<div id="pigeon"></div>
<div id="pigeon-r"></div>
<div id="pigeon-b"></div>
<div id="hashtag">#</div>
<div id="glitch-flash"></div>
<div id="warning"></div>

<!-- D-pad (bottom-left) -->
<div id="dpad">
  <button id="btn-w" class="btn">▲</button>
  <button id="btn-a" class="btn">◀</button>
  <button id="btn-s" class="btn">▼</button>
  <button id="btn-d" class="btn">▶</button>
</div>

<!-- Jump (bottom-right) -->
<button id="btn-jump" class="btn">↑</button>

<script>
  // ─── ASCII poses ──────────────────────────────────────────────────────────────

  const JUMP_POSES = {
    front: "   .-. \n  /'v'\\\n (/   \\)\n   \" \" ",
    back:  "   .-. \n  /   \\\n (/-+-\\)\n   \" \" ",
    right: "   .-. \n  / 'c\\\n (/   )\n   ` ` ",
    left:  "   .-. \n /ↄ' \\ \n  (   \\)\n   ` ` ",
  };

  // Angry variants — ˣ marks the red-glow spots
  const ANGRY_JUMP_POSES = {
    front: "   .-. \n  /ˣvˣ\\\n (/   \\)\n   \" \" ",
    back:  "   .-. \n  /   \\\n (/-+-\\)\n   \" \" ",
    right: "   .-. \n  / ˣc\\\n (/   )\n   ` ` ",
    left:  "   .-. \n /ↄˣ \\ \n  (   \\)\n   ` ` ",
  };

  const POSES = {
    front: [
      "   .-. \n  /'v'\\\n (/   \\)\n   - - ",
      "   .-. \n  /'v'\\\n (/   \\)\n   \" - ",
      "   .-. \n  /'v'\\\n (/   \\)\n   - - ",
      "   .-. \n  /'v'\\\n (/   \\)\n   - \" ",
    ],
    back: [
      "   .-. \n  /   \\\n (/-+-\\)\n   - - ",
      "   .-. \n  /   \\\n (/-+-\\)\n   - \" ",
      "   .-. \n  /   \\\n (/-+-\\)\n   - - ",
      "   .-. \n  /   \\\n (/-+-\\)\n   \" - ",
    ],
    right: [
      "   .-. \n  / 'c\\\n (/   )\n   - - ",
      "   .-. \n  / 'c\\\n (/   )\n   ` - ",
      "   .-. \n  / 'c\\\n (/   )\n   - - ",
      "   .-. \n  / 'c\\\n (/   )\n   - ` ",
    ],
    left: [
      "   .-. \n /ↄ' \\ \n  (   \\)\n   - - ",
      "   .-. \n /ↄ' \\ \n  (   \\)\n   ` - ",
      "   .-. \n /ↄ' \\ \n  (   \\)\n   - - ",
      "   .-. \n /ↄ' \\ \n  (   \\)\n   - ` ",
    ],
  };

  const ANGRY_POSES = {
    front: [
      "   .-. \n  /ˣvˣ\\\n (/   \\)\n   - - ",
      "   .-. \n  /ˣvˣ\\\n (/   \\)\n   \" - ",
      "   .-. \n  /ˣvˣ\\\n (/   \\)\n   - - ",
      "   .-. \n  /ˣvˣ\\\n (/   \\)\n   - \" ",
    ],
    back: [
      "   .-. \n  /   \\\n (/-+-\\)\n   - - ",
      "   .-. \n  /   \\\n (/-+-\\)\n   - \" ",
      "   .-. \n  /   \\\n (/-+-\\)\n   - - ",
      "   .-. \n  /   \\\n (/-+-\\)\n   \" - ",
    ],
    right: [
      "   .-. \n  / ˣc\\\n (/   )\n   - - ",
      "   .-. \n  / ˣc\\\n (/   )\n   ` - ",
      "   .-. \n  / ˣc\\\n (/   )\n   - - ",
      "   .-. \n  / ˣc\\\n (/   )\n   - ` ",
    ],
    left: [
      "   .-. \n /ↄˣ \\ \n  (   \\)\n   - - ",
      "   .-. \n /ↄˣ \\ \n  (   \\)\n   ` - ",
      "   .-. \n /ↄˣ \\ \n  (   \\)\n   - - ",
      "   .-. \n /ↄˣ \\ \n  (   \\)\n   - ` ",
    ],
  };

  // ─── Config ───────────────────────────────────────────────────────────────────

  const CFG = {
    speed:      3.2,
    walkFPS:    7,
    margin:     56,
    jumpForce: -11,
    gravity:    0.75,
    hitRadius:  38,
  };

  // ─── State ────────────────────────────────────────────────────────────────────

  let x            = window.innerWidth  / 2;
  let y            = window.innerHeight / 2;
  let direction    = 'front';
  let frameIndex   = 0;
  let lastWalkTime = 0;

  let jumping      = false;
  let jumpVelocity = 0;
  let jumpOffset   = 0;

  const keys = { w: false, a: false, s: false, d: false };

  // ─── Glitch + hashtag state ───────────────────────────────────────────────────

  let hashX = 0, hashY = 0;
  let glitchCount     = 0;
  let glitching       = false;
  let glitchIntensity = 0;

  const pigeonEl  = document.getElementById('pigeon');
  const pigeonR   = document.getElementById('pigeon-r');
  const pigeonB   = document.getElementById('pigeon-b');
  const shadowEl  = document.getElementById('shadow');
  const hashEl    = document.getElementById('hashtag');
  const flashEl   = document.getElementById('glitch-flash');
  const warningEl = document.getElementById('warning');

  const GLITCH_CHARS = '▓█░▒╬╪╫#@!|\\×≠⁺'.split('');

  // ─── Audio (Web Audio API — no external files) ────────────────────────────────

  let audioCtx = null;

  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playGlitchSound(intensity) {
    try {
      const ctx = getAudioCtx();
      const i   = Math.min(intensity, 6);
      const t   = ctx.currentTime;
      const dur = 0.18 + i * 0.025;          // 205ms → 330ms

      // ── Noise burst (harsh impact) ──────────────────────────────────────────
      const bufLen = Math.floor(ctx.sampleRate * dur);
      const buf    = ctx.createBuffer(1, bufLen, ctx.sampleRate);
      const data   = buf.getChannelData(0);
      for (let j = 0; j < bufLen; j++) {
        data[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / bufLen, 0.35);
      }
      const noise     = ctx.createBufferSource();
      noise.buffer    = buf;
      const hpf       = ctx.createBiquadFilter();
      hpf.type        = 'highpass';
      hpf.frequency.value = 900 + i * 250;   // sharper each time
      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.28 + i * 0.04, t);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      noise.connect(hpf);
      hpf.connect(noiseGain);
      noiseGain.connect(ctx.destination);
      noise.start(t);
      noise.stop(t + dur);

      // ── Square sweep (digital error tone) ───────────────────────────────────
      const osc     = ctx.createOscillator();
      osc.type      = 'square';
      osc.frequency.setValueAtTime(1200 + i * 180, t);
      osc.frequency.exponentialRampToValueAtTime(80, t + dur * 0.7);
      const oscGain = ctx.createGain();
      oscGain.gain.setValueAtTime(0.12 + i * 0.015, t);
      oscGain.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.65);
      osc.connect(oscGain);
      oscGain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + dur);

    } catch (_) { /* audio not available — silent fallback */ }
  }

  const WARNINGS = [
    "DON'T DO IT AGAIN",
    "DON'T DO IT AGAIN !!",
    "I SAID DON'T",
    ". . .",
    "LAST WARNING",
  ];

  // ─── Angry eyes ───────────────────────────────────────────────────────────────

  let angryMode = false;

  const EYE_OPEN  = '<span style="color:#ff1a1a;text-shadow:0 0 4px #ff0000,0 0 12px #cc0000,0 0 24px #880000">';
  const EYE_CLOSE = '</span>';

  // ˣ is the explicit red-glow marker — replace every occurrence globally.
  function poseToHTML(pose) {
    const h = pose.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return h.replace(/ˣ/g, `${EYE_OPEN}ˣ${EYE_CLOSE}`);
  }

  function corruptText(text) {
    return text.split('').map(c => {
      if (c === '\n' || c === ' ') return c;
      return Math.random() < 0.45
        ? GLITCH_CHARS[Math.floor(Math.random() * GLITCH_CHARS.length)]
        : c;
    }).join('');
  }

  function spawnHashtag() {
    const m = 110;
    hashX = m + Math.random() * (window.innerWidth  - m * 2);
    hashY = m + Math.random() * (window.innerHeight - m * 2);
    hashEl.style.left    = hashX + 'px';
    hashEl.style.top     = hashY + 'px';
    hashEl.style.display = 'block';
  }

  function showWarning() {
    const idx = Math.min(glitchCount - 1, WARNINGS.length - 1);
    warningEl.textContent = WARNINGS[idx];
    warningEl.style.opacity = '0.55';
    // Eyes go red on "LAST WARNING" and stay red
    if (glitchCount >= WARNINGS.length) angryMode = true;
  }

  function triggerGlitch() {
    if (glitching) return;
    glitching = true;
    glitchCount++;
    glitchIntensity = Math.min(glitchCount, 6);

    const duration = 300 + glitchIntensity * 30; // 330ms → 480ms

    // Snap warning out
    warningEl.style.transition = 'opacity 0.05s';
    warningEl.style.opacity    = '0';
    setTimeout(() => { warningEl.style.transition = 'opacity 0.4s'; }, 80);

    // Hide hashtag instantly
    hashEl.style.display = 'none';

    // Sound
    playGlitchSound(glitchIntensity);

    // White flash — brighter each repetition
    const flashStrength = Math.min(0.22 + glitchIntensity * 0.07, 0.65);
    flashEl.style.opacity = String(flashStrength);
    setTimeout(() => { flashEl.style.opacity = '0'; }, 50 + glitchIntensity * 5);

    // Activate RGB overlays
    pigeonR.style.display = 'block';
    pigeonB.style.display = 'block';

    // Resolve
    setTimeout(() => {
      glitching = false;
      pigeonR.style.display = 'none';
      pigeonB.style.display = 'none';
      spawnHashtag();
      setTimeout(showWarning, 200);
    }, duration);
  }

  // ─── Keyboard ─────────────────────────────────────────────────────────────────

  const KEY_MAP = {
    w: 'w', W: 'w', ArrowUp:    'w',
    a: 'a', A: 'a', ArrowLeft:  'a',
    s: 's', S: 's', ArrowDown:  's',
    d: 'd', D: 'd', ArrowRight: 'd',
  };

  document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (!jumping) {
        jumping      = true;
        jumpVelocity = CFG.jumpForce;
        document.getElementById('btn-jump')?.classList.add('active');
      }
      return;
    }
    const k = KEY_MAP[e.key];
    if (!k) return;
    e.preventDefault();
    if (!keys[k]) {
      keys[k] = true;
      document.getElementById('btn-' + k)?.classList.add('active');
    }
  });

  document.addEventListener('keyup', e => {
    if (e.key === ' ' || e.code === 'Space') {
      document.getElementById('btn-jump')?.classList.remove('active');
      return;
    }
    const k = KEY_MAP[e.key];
    if (!k) return;
    keys[k] = false;
    document.getElementById('btn-' + k)?.classList.remove('active');
  });

  // ─── Button controls (pointer events: touch + mouse) ─────────────────────────

  function bindMoveBtn(el, keyName) {
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      keys[keyName] = true;
      el.classList.add('active');
    });
    const release = () => {
      keys[keyName] = false;
      el.classList.remove('active');
    };
    el.addEventListener('pointerup',     release);
    el.addEventListener('pointercancel', release);
  }

  bindMoveBtn(document.getElementById('btn-w'), 'w');
  bindMoveBtn(document.getElementById('btn-a'), 'a');
  bindMoveBtn(document.getElementById('btn-s'), 's');
  bindMoveBtn(document.getElementById('btn-d'), 'd');

  const jumpBtn = document.getElementById('btn-jump');
  jumpBtn.addEventListener('pointerdown', e => {
    e.preventDefault();
    jumpBtn.setPointerCapture(e.pointerId);
    if (!jumping) {
      jumping      = true;
      jumpVelocity = CFG.jumpForce;
      jumpBtn.classList.add('active');
    }
  });
  jumpBtn.addEventListener('pointerup',     () => jumpBtn.classList.remove('active'));
  jumpBtn.addEventListener('pointercancel', () => jumpBtn.classList.remove('active'));

  // ─── Animation loop ───────────────────────────────────────────────────────────

  function tick(timestamp) {
    let dx = 0, dy = 0;
    if (keys.w) dy -= CFG.speed;
    if (keys.s) dy += CFG.speed;
    if (keys.a) dx -= CFG.speed;
    if (keys.d) dx += CFG.speed;

    if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

    const moving = dx !== 0 || dy !== 0;

    if      (dx > 0) direction = 'right';
    else if (dx < 0) direction = 'left';
    else if (dy < 0) direction = 'back';
    else if (dy > 0) direction = 'front';

    const m = CFG.margin;
    x = Math.max(m, Math.min(window.innerWidth  - m, x + dx));
    y = Math.max(m, Math.min(window.innerHeight - m, y + dy));

    // Jump physics
    if (jumping) {
      jumpVelocity += CFG.gravity;
      jumpOffset   += jumpVelocity;
      if (jumpOffset >= 0) {
        jumpOffset   = 0;
        jumpVelocity = 0;
        jumping      = false;
        document.getElementById('btn-jump')?.classList.remove('active');
      }
    }

    // Walk frame
    if (!jumping && moving && timestamp - lastWalkTime > 1000 / CFG.walkFPS) {
      frameIndex   = (frameIndex + 1) % 4;
      lastWalkTime = timestamp;
    }
    if (!moving && !jumping) frameIndex = 0;

    // Hashtag collision
    if (!glitching && hashEl.style.display !== 'none') {
      const ddx = x - hashX;
      const ddy = y - hashY;
      if (Math.sqrt(ddx * ddx + ddy * ddy) < CFG.hitRadius) {
        triggerGlitch();
      }
    }

    // Pose — switch to angry set after last warning
    const poseSet = angryMode ? ANGRY_POSES      : POSES;
    const jumpSet = angryMode ? ANGRY_JUMP_POSES : JUMP_POSES;
    let pose = jumping ? jumpSet[direction] : poseSet[direction][frameIndex];

    // Glitch visuals — per-frame corruption + RGB split + jitter
    let jitter = 0;
    if (glitching) {
      const i  = glitchIntensity;
      jitter   = (Math.random() - 0.5) * i * 5;
      const rgbOff = 3 + i * 1.6;
      const rgbJ   = (Math.random() - 0.5) * i * 2.5;

      pose = corruptText(pose);

      pigeonR.textContent = pose;
      pigeonB.textContent = pose;
      pigeonR.style.left  = (x + jitter - rgbOff + rgbJ) + 'px';
      pigeonR.style.top   = (y + jumpOffset) + 'px';
      pigeonB.style.left  = (x + jitter + rgbOff + rgbJ) + 'px';
      pigeonB.style.top   = (y + jumpOffset) + 'px';
    }

    // Shadow
    const shadowScale   = Math.max(0.25, 1 + jumpOffset / 90);
    const shadowOpacity = Math.max(0.15, 0.6 * shadowScale);

    if (angryMode && !glitching) {
      pigeonEl.innerHTML = poseToHTML(pose);
    } else {
      pigeonEl.textContent = pose;
    }
    pigeonEl.style.left  = (x + jitter) + 'px';
    pigeonEl.style.top   = (y + jumpOffset) + 'px';

    shadowEl.style.left      = x + 'px';
    shadowEl.style.top       = (y + 42) + 'px';
    shadowEl.style.transform = `translate(-50%, -50%) scaleX(${shadowScale})`;
    shadowEl.style.opacity   = shadowOpacity;

    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', () => {
    x = Math.min(x, window.innerWidth  - CFG.margin);
    y = Math.min(y, window.innerHeight - CFG.margin);
  });

  // ─── Boot ─────────────────────────────────────────────────────────────────────

  spawnHashtag();
  requestAnimationFrame(tick);
</script>

</body>
</html>
