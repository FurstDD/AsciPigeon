<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AsciPigeon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      color: #eee;
    }

    #scene {
      position: relative;
      width: 600px;
      height: 600px;
    }

    /* Zichtbaar cirkelvormig pad */
    #track {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 420px;
      height: 420px;
      border: 2px dashed #2a2a2a;
      border-radius: 50%;
    }

    /* Midden tekst */
    #center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #333;
      line-height: 1.6;
      pointer-events: none;
      user-select: none;
    }

    #center .title {
      font-size: 22px;
      letter-spacing: 4px;
      color: #444;
    }

    #center .subtitle {
      font-size: 11px;
      color: #2a2a2a;
      margin-top: 6px;
      letter-spacing: 2px;
    }

    /* De kip container */
    #chicken {
      position: absolute;
      white-space: pre;
      font-size: 15px;
      line-height: 1.3;
      color: #e8c040;
      text-shadow: 0 0 8px rgba(232, 192, 64, 0.4);
      /* Ankerpunt in het midden van de kip */
      transform: translate(-50%, -50%);
      pointer-events: none;
      user-select: none;
    }

    /*
     * TODO: vervang de ASCII-art kip door een <img> sprite:
     *   #chicken { display: block; width: 64px; height: 64px; }
     *   gebruik background-image + background-position voor sprite sheets
     */

    /* Schaduw/voetafdruk onder de kip */
    #shadow {
      position: absolute;
      width: 28px;
      height: 6px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.5) 0%, transparent 70%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* Debug info (verberg in productie) */
    #debug {
      position: fixed;
      bottom: 16px;
      left: 16px;
      font-size: 10px;
      color: #2a2a2a;
      font-family: monospace;
    }
  </style>
</head>
<body>

<div id="scene">
  <div id="track"></div>

  <div id="center">
    <div class="title">AsciPigeon</div>
    <div class="subtitle">cluck cluck</div>
  </div>

  <div id="shadow"></div>
  <div id="chicken"></div>
</div>

<div id="debug"></div>

<script>
  // ─── Configuratie ────────────────────────────────────────────────────────────

  const CONFIG = {
    radius:      210,          // straal van het looppad (px)
    speed:       0.008,        // radialen per frame (hoger = sneller)
    walkFPS:     7,            // stapanimatie frames per seconde
    centerX:     300,          // middelpunt van de scene (px)
    centerY:     300,
    showDebug:   false,
  };

  // ─── ASCII frames ────────────────────────────────────────────────────────────
  //
  //  Twee richtingen: rechts (>) en links (<).
  //  Elke array bevat 4 loopframes.
  //
  //  TODO: vervang deze strings door een <img> met spritesheet frames.

  const FRAMES = {
    right: [
      // frame 0 — beide poten neer
      '  __  \n>(oo) \n  ||\n  ^^ ',
      // frame 1 — linkerpoot op
      '  __  \n>(oo) \n  |\\ \n  ^  ',
      // frame 2 — beide poten neer
      '  __  \n>(oo) \n  ||\n  ^^ ',
      // frame 3 — rechterpoot op
      '  __  \n>(oo) \n  /| \n    ^',
    ],
    left: [
      '  __  \n (oo)<\n  ||\n  ^^ ',
      '  __  \n (oo)<\n  /| \n    ^',
      '  __  \n (oo)<\n  ||\n  ^^ ',
      '  __  \n (oo)<\n  |\\ \n  ^  ',
    ],
  };

  // ─── State ───────────────────────────────────────────────────────────────────

  let angle        = 0;           // huidige hoek in radialen
  let frameIndex   = 0;           // huidige animatieframe
  let lastWalkTime = 0;           // voor frame-timing

  const chickenEl = document.getElementById('chicken');
  const shadowEl  = document.getElementById('shadow');
  const debugEl   = document.getElementById('debug');

  // ─── Animatielus ────────────────────────────────────────────────────────────

  function tick(timestamp) {
    // 1. Beweeg de kip langs de cirkel
    angle += CONFIG.speed;
    if (angle >= Math.PI * 2) angle -= Math.PI * 2;

    // 2. Bereken positie
    const x = CONFIG.centerX + CONFIG.radius * Math.cos(angle);
    const y = CONFIG.centerY + CONFIG.radius * Math.sin(angle);

    // 3. Bepaal looprichting
    //    dx/dt = -R * sin(angle) → positief (naar rechts) als sin(angle) < 0
    //    → sin(angle) < 0 wanneer angle ∈ (π, 2π)
    const movingRight = angle > Math.PI;

    // 4. Wissel stapframe op basis van tijd
    if (timestamp - lastWalkTime > 1000 / CONFIG.walkFPS) {
      frameIndex = (frameIndex + 1) % FRAMES.right.length;
      lastWalkTime = timestamp;
    }

    // 5. Render kip
    const frames = movingRight ? FRAMES.right : FRAMES.left;
    chickenEl.textContent = frames[frameIndex];
    chickenEl.style.left  = x + 'px';
    chickenEl.style.top   = y + 'px';

    // 6. Schaduw iets lager dan de kip
    shadowEl.style.left = x + 'px';
    shadowEl.style.top  = (y + 22) + 'px';

    // 7. Debug
    if (CONFIG.showDebug) {
      const deg = ((angle * 180) / Math.PI).toFixed(1);
      debugEl.textContent =
        `angle: ${deg}° | dir: ${movingRight ? 'rechts' : 'links'} | frame: ${frameIndex}`;
    }

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
</script>

</body>
</html>
